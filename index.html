<style>
:root{--bg:#f1f6f4;--card:#fff;--ink:#12302b;--mut:#5b7a74;--pri:#0f5c4d;--pri2:#0a4237;--gold:#e0a526;--gold2:#b8841a;--ok:#2e9e5b;--okbg:#dff3e7;--bad:#d64545;--badbg:#fbe3e3;--line:#d3e1dd;--lock:#c9d6d2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a18;--card:#162826;--ink:#e6f1ee;--mut:#8fb0a9;--pri:#2fa58d;--pri2:#1f7d69;--gold:#f0b83a;--gold2:#b8841a;--ok:#4cc17f;--okbg:#17402b;--bad:#ef6b6b;--badbg:#4a2222;--line:#2a423e;--lock:#2a3d39}}
:root[data-theme="dark"]{--bg:#0e1a18;--card:#162826;--ink:#e6f1ee;--mut:#8fb0a9;--pri:#2fa58d;--pri2:#1f7d69;--gold:#f0b83a;--gold2:#b8841a;--ok:#4cc17f;--okbg:#17402b;--bad:#ef6b6b;--badbg:#4a2222;--line:#2a423e;--lock:#2a3d39}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
.logo{font-family:'Reem Kufi',serif;font-size:28px;font-weight:700;color:var(--pri)}
.stats{display:flex;gap:14px;font-weight:800}
.unit{margin:6px 16px 8px;padding:16px 18px;background:var(--pri);color:#fff;border-radius:18px;border-bottom:5px solid var(--pri2)}
.unit h2{margin:0;font-size:20px;font-weight:800}
.unit p{margin:2px 0 0;opacity:.85;font-size:14px}
.unit.soon{background:var(--lock);border-color:transparent;color:var(--mut);margin-top:34px}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 0 10px}
.node{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(var(--x,0));width:130px}
.node .c{width:78px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff;border-bottom:6px solid}
.node.done .c{background:var(--gold);border-color:var(--gold2)}
.node.cur .c{background:var(--pri);border-color:var(--pri2);box-shadow:0 0 0 6px color-mix(in srgb,var(--pri) 25%,transparent)}
.node.lock .c{background:var(--lock);border-color:color-mix(in srgb,var(--lock) 70%,#000);font-size:24px}
.node .lb{font-weight:700;font-size:15px;line-height:1.2}
.node .lb em{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--mut)}
.node:disabled{cursor:default}
.node:not(:disabled):active .c{transform:translateY(3px);border-bottom-width:3px}
.foot-note{text-align:center;color:var(--mut);font-size:13px;padding:10px 24px 28px}
/* lesson */
.lesson{display:flex;flex-direction:column;flex:1;min-height:100vh}
.bar{display:flex;align-items:center;gap:14px;padding:16px 18px}
.x{background:none;border:0;font-size:22px;color:var(--mut);padding:4px 8px}
.prog{flex:1;height:14px;background:var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ok);border-radius:9px;transition:width .35s}
.q{flex:1;padding:6px 20px 20px;display:flex;flex-direction:column}
.q h2{margin:8px 0 0;font-size:24px;font-weight:800}
.sub{margin:2px 0 0;color:var(--mut);font-size:14px;direction:ltr;text-align:right}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:190px;margin:12px 0}
.glyph{font-family:'Reem Kufi',serif;font-size:130px;line-height:1.2;color:var(--pri)}
.emoji{font-size:84px;line-height:1.1}
.w{font-family:'Reem Kufi',serif;font-size:42px;font-weight:700}
.ew{color:var(--mut);direction:ltr}
.spk{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:50%;width:86px;height:86px;font-size:36px}
.spk.sm{width:48px;height:48px;font-size:20px;border-bottom-width:3px;margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 8px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:20px;font-weight:800}
.opt .ch{font-family:'Reem Kufi',serif;font-size:44px;font-weight:700;line-height:1.2}
.opt small{font-weight:400;font-size:13px;color:var(--mut);direction:ltr}

['اقرأ النص ثم أجب: كم يومًا يعمل أحمد أكثر من عليّ؟','يعمل أحمد خمسة أيام في الأسبوع، ويعمل عليّ ثلاثة أيام.','يومان','يوم واحد','ثلاثة أيام'],
['رتّب لتكوين سؤال: المستشفى / لماذا / إلى / حضرتَ','','لماذا حضرتَ إلى المستشفى؟','حضرتَ لماذا إلى المستشفى؟','إلى لماذا المستشفى حضرتَ؟'],
['اختر الجملة المفيدة التي تستعمل «لكن».','','أحبُّ الشاي لكنني لا أشربه كثيرًا','أحبُّ لكن الشاي أنا كثيرًا','لكن لكن أحبُّ الشاي'],
['اختر الصحيح: أريد ____ بيضاء.','','قميصًا','قميصٌ','قميصٍ'],
['لماذا ستسافر سارة إلى القرية؟','ستبدأ العطلة غدًا. ستسافر سارة إلى بلدها، وستقضي العطلة في القرية لتساعد والديها.','لتساعد والديها','لتدرس في الجامعة','لتعمل في شركة'],
['أعد كتابة الجملة بعد تصحيح الخطأ: ذهبَ الطالباتُ إلى الجامعةِ.','','ذهبتِ الطالباتُ إلى الجامعةِ','ذهبوا الطالباتُ إلى الجامعةِ','ذهبَ الطالباتُ إلى الجامعةُ'],

['أعرب كلمة «الطالبَ» في الجملة: إنَّ الطالبَ مجتهدٌ.','','اسم إنَّ منصوب وعلامة نصبه الفتحة','مبتدأ مرفوع وعلامة رفعه الضمة','خبر إنَّ منصوب وعلامة نصبه الفتحة'],

['اختر الفقرة التي تصف اليوم المعتاد بفعل ماضٍ وفعل مضارع.','','أستيقظ كل صباح وأشرب الشاي، وأمس ذهبتُ إلى العمل ثم رجعتُ إلى البيت.','أستيقظ وأشرب وأذهب ثم أرجع إلى البيت.','الشاي والصباح والعمل والبيت كل يوم.'],
['اختر السؤال المناسب لهذه الإجابة: أسافر إلى القاهرة لأنني أزور أسرتي.','','لماذا تسافر إلى القاهرة؟','متى تسافر إلى القاهرة؟','أين تسافر إلى القاهرة؟']];
const SEC=['القسم الأول: أسئلة سهلة','القسم الثاني: أسئلة متوسطة','القسم الثالث: أسئلة صعبة'];
function welcome(){app.innerHTML=`<div class="wel">${mas('happy',120)}<div class="brand">ض</div><div class="bubble">أهلًا وسهلًا! أنا رفيق، صاحبك في تعلّم العربية 👋</div><p style="margin:0;font-weight:800;font-size:20px">ما اسمك؟</p><input class="inp" id="nm" maxlength="20" placeholder="اكتب اسمك هنا" autocomplete="off"><button class="btn" id="go" style="max-width:320px" disabled>التالي</button></div>`;
const i=document.getElementById('nm'),b=document.getElementById('go');i.oninput=()=>b.disabled=!i.value.trim();i.onkeydown=e=>{if(e.key==='Enter'&&i.value.trim())b.click()};b.onclick=()=>{S.name=i.value.trim();save();intro()};i.focus()}
function intro(){app.innerHTML=`<div class="wel">${mas('cheer',110)}<h1 class="lvl">أهلًا بك يا ${esc(S.name)}!</h1><div class="bubble">قبل أن نبدأ، سنجري اختبارًا قصيرًا لتحديد مستواك، حتى نعرف من أين تبدأ بالضبط.</div><button class="btn" style="max-width:320px" onclick="details()">التالي</button></div>`}
function details(){app.innerHTML=`<div class="wel">${mas('happy',90)}<h1 class="lvl">تفاصيل الاختبار</h1><ul class="list"><li>٣٠ سؤالًا في ٣ أقسام: ١٠ سهلة، ١٠ متوسطة، ١٠ صعبة</li><li>أسئلة اختيار من متعدد، ولن تظهر الإجابات الصحيحة أثناء الاختبار</li><li>إن لم تعرف الإجابة اضغط «لا أعرف»، ولا تقلق</li><li>في النهاية ستعرف نتيجتك في كل قسم ومستواك</li></ul><button class="btn" style="max-width:320px" onclick="startP()">ابدأ الاختبار</button></div>`}
let PO=[],pi=0,pa=[];
function startP(){PO=[0,1,2].flatMap(k=>shuffle([...Array(10).keys()].map(i=>k*10+i)));pi=0;pa=Array(30).fill(0);showP()}
function showP(){
if(pi>=30)return resultP();
const q=PO[pi],d=P[q],sec=Math.floor(q/10);let sel=null;
const o=shuffle(d.slice(2).map((t,j)=>({t,ok:j===0})));
app.innerHTML=`<div class="lesson"><div class="bar"><button class="x" onclick="intro()" aria-label="إغلاق">✕</button><div class="prog"><i style="width:${pi/30*100}%"></i></div><div>${mas('happy',40)}</div></div><main class="q"><span class="chipS">${SEC[sec]} (${pi+1}/30)</span><h2>${d[0]}</h2>${d[1]?`<div class="ctx">${d[1]}</div>`:''}<div class="popts" id="po">${o.map((x,j)=>`<button class="opt" data-j="${j}">${x.t}</button>`).join('')}</div><button class="skip" id="sk">لا أعرف</button></main><footer class="foot"><button class="btn" id="nx" disabled>التالي</button></footer></div>`;
const nx=document.getElementById('nx'),go=ok=>{pa[q]=ok?1:0;pi++;showP()};
document.getElementById('po').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;sel=+b.dataset.j;document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));nx.disabled=false};
nx.onclick=()=>go(o[sel].ok);document.getElementById('sk').onclick=()=>go(false);
}
function resultP(){
const sc=[0,1,2].map(k=>pa.slice(k*10,k*10+10).reduce((a,b)=>a+b,0)),t=sc[0]+sc[1]+sc[2],lv=LV.findIndex(l=>t<=l.max);
S.placed=true;S.level=lv;S.sc=sc;save();
app.innerHTML=`<div class="wel">${mas('cheer',100)}<h1 class="lvl">أحسنت يا ${esc(S.name)}!</h1><table class="res"><tr><td>الأسئلة السهلة</td><td>${sc[0]} / 10</td></tr><tr><td>الأسئلة المتوسطة</td><td>${sc[1]} / 10</td></tr><tr><td>الأسئلة الصعبة</td><td>${sc[2]} / 10</td></tr><tr><td><b>النتيجة النهائية</b></td><td>${t} / 30</td></tr></table><div class="bubble">مستواك: ${LV[lv].n}<br><small>${LV[lv].en}</small></div><p style="margin:0">${LV[lv].d}</p><button class="btn" style="max-width:320px" onclick="home()">ابدأ التعلم</button><button class="skip" onclick="startP()">إعادة الاختبار</button></div>`;
confetti();sfx(true);
}
function init(){if(!S.name)welcome();else if(!S.placed)intro();else home()}
function splash(){
  app.innerHTML=`<div class="wel">${mas('happy',110)}<div class="brand">ض</div><p class="lvl" style="font-size:26px">جاهز لتتعلّم العربية؟</p><button class="btn" id="st" style="max-width:260px">ابدأ</button></div>`;
  const b=document.getElementById('st');b.focus();
  b.onclick=()=>{actx();app.innerHTML='';fxGo(init,S.name?'أهلًا بعودتك يا '+S.name+'!':'أهلًا بك!')};
}
splash();
</script>
</body>
